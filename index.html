
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            height: 90vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header .username {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-screen {
            padding: 40px;
            text-align: center;
        }

        .login-screen h2 {
            margin-bottom: 30px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            text-align: left;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message .sender {
            font-weight: bold;
            margin-bottom: 5px;
            color: #667eea;
        }

        .message .text {
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            display: inline-block;
            max-width: 70%;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.own .sender {
            text-align: right;
            color: #764ba2;
        }

        .message.own .text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            float: right;
        }

        .message.own {
            text-align: right;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            border-radius: 25px;
            padding: 12px 25px;
        }

        .hidden {
            display: none;
        }

        .profile-link {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 12px;
        }

        .profile-link a {
            color: white;
            text-decoration: underline;
            word-break: break-all;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            margin-top: 10px;
            font-size: 14px;
        }

        .friends-list {
            padding: 20px;
            background: #f5f5f5;
        }

        .friend-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .friend-item:hover {
            transform: translateX(5px);
        }

        .friend-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .add-friend {
            margin-bottom: 20px;
        }

        .add-friend input {
            width: calc(100% - 100px);
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-right: 10px;
        }

        .add-friend button {
            padding: 10px 20px;
        }

        .tab-buttons {
            display: flex;
            background: white;
            border-bottom: 1px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 16px;
            color: #666;
        }

        .tab-btn.active {
            border-bottom-color: #667eea;
            color: #667eea;
            font-weight: bold;
        }

        .tab-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .no-selection {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="login-screen">
            <h2>Welcome to Simple Chat</h2>
            <div class="form-group">
                <label>Choose a Username</label>
                <input type="text" id="usernameInput" placeholder="Enter your username">
            </div>
            <button onclick="createProfile()">Create Profile</button>
        </div>

        <!-- Chat Screen -->
        <div id="chatScreen" class="hidden">
            <div class="header">
                <h1>Simple Chat</h1>
                <div class="username">Logged in as: <span id="currentUser"></span></div>
                <div class="profile-link">
                    Your profile link: <a id="profileLink" href="#" target="_blank"></a>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showTab('friends')">Friends</button>
                <button class="tab-btn" onclick="showTab('chat')">Chat</button>
            </div>

            <div id="friendsTab" class="tab-content">
                <div class="friends-list">
                    <div class="add-friend">
                        <input type="text" id="friendUsernameInput" placeholder="Enter friend's username">
                        <button onclick="addFriend()">Add Friend</button>
                    </div>
                    <div id="friendsList"></div>
                </div>
            </div>

            <div id="chatTab" class="tab-content hidden">
                <div id="noSelection" class="no-selection">
                    Select a friend to start chatting
                </div>
                <div id="chatContainer" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
                    <div class="messages" id="messages"></div>
                    <div class="input-area">
                        <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                        <button onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Simple in-memory storage (works without any backend)
        // For persistence, we'll use localStorage
        
        let currentUsername = '';
        let currentChatFriend = '';
        let friends = [];

        // Check if user already has a profile from URL
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const profileUser = urlParams.get('user');
            
            const savedUsername = localStorage.getItem('username');
            
            if (savedUsername) {
                currentUsername = savedUsername;
                showChatScreen();
                loadFriends();
                
                // If there's a profile user in URL, add them as friend
                if (profileUser && profileUser !== currentUsername) {
                    addFriendByUsername(profileUser);
                }
            } else if (profileUser) {
                // Pre-fill username input
                document.getElementById('usernameInput').value = '';
            }
        });

        window.createProfile = function() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert('Please enter a username');
                return;
            }
            
            currentUsername = username;
            localStorage.setItem('username', username);
            
            showChatScreen();
            loadFriends();
        };

        function showChatScreen() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');
            document.getElementById('currentUser').textContent = currentUsername;
            
            // Set profile link
            const profileUrl = window.location.origin + window.location.pathname + '?user=' + encodeURIComponent(currentUsername);
            const linkElement = document.getElementById('profileLink');
            linkElement.href = profileUrl;
            linkElement.textContent = profileUrl;
        }

        window.logout = function() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('username');
                localStorage.removeItem('friends');
                window.location.reload();
            }
        };

        window.addFriend = function() {
            const friendUsername = document.getElementById('friendUsernameInput').value.trim();
            addFriendByUsername(friendUsername);
        };

        function addFriendByUsername(friendUsername) {
            if (!friendUsername) {
                alert('Please enter a friend\'s username');
                return;
            }
            
            if (friendUsername === currentUsername) {
                alert('You cannot add yourself as a friend');
                return;
            }
            
            if (friends.includes(friendUsername)) {
                alert('Already friends with ' + friendUsername);
                return;
            }
            
            friends.push(friendUsername);
            saveFriends();
            document.getElementById('friendUsernameInput').value = '';
            renderFriendsList();
        }

        function loadFriends() {
            const savedFriends = localStorage.getItem('friends');
            if (savedFriends) {
                friends = JSON.parse(savedFriends);
            }
            renderFriendsList();
        }

        function saveFriends() {
            localStorage.setItem('friends', JSON.stringify(friends));
        }

        function renderFriendsList() {
            const friendsList = document.getElementById('friendsList');
            friendsList.innerHTML = '';
            
            if (friends.length === 0) {
                friendsList.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">No friends yet. Add friends by entering their username above.</div>';
                return;
            }
            
            friends.forEach(friend => {
                const friendItem = document.createElement('div');
                friendItem.className = 'friend-item';
                if (friend === currentChatFriend) {
                    friendItem.classList.add('active');
                }
                friendItem.textContent = friend;
                friendItem.onclick = () => openChat(friend);
                friendsList.appendChild(friendItem);
            });
        }

        window.openChat = function(friendUsername) {
            currentChatFriend = friendUsername;
            showTab('chat');
            renderFriendsList();
            
            document.getElementById('noSelection').classList.add('hidden');
            document.getElementById('chatContainer').classList.remove('hidden');
            
            loadMessages();
            
            // Auto-scroll to bottom
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        };

        window.sendMessage = function() {
            const messageInput = document.getElementById('messageInput');
            const messageText = messageInput.value.trim();
            
            if (!messageText || !currentChatFriend) return;
            
            const message = {
                from: currentUsername,
                to: currentChatFriend,
                text: messageText,
                timestamp: Date.now()
            };
            
            // Save message to localStorage
            saveMessage(message);
            
            messageInput.value = '';
            loadMessages();
        };

        function saveMessage(message) {
            const chatKey = getChatKey(message.from, message.to);
            let messages = JSON.parse(localStorage.getItem(chatKey) || '[]');
            messages.push(message);
            localStorage.setItem(chatKey, JSON.stringify(messages));
        }

        function getChatKey(user1, user2) {
            // Create a consistent key for both users
            return [user1, user2].sort().join('_');
        }

        function loadMessages() {
            const chatKey = getChatKey(currentUsername, currentChatFriend);
            const messages = JSON.parse(localStorage.getItem(chatKey) || '[]');
            
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';
            
            messages.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';
                
                const isOwn = msg.from === currentUsername;
                if (isOwn) {
                    messageDiv.classList.add('own');
                }
                
                const senderDiv = document.createElement('div');
                senderDiv.className = 'sender';
                senderDiv.textContent = msg.from;
                
                const textDiv = document.createElement('div');
                textDiv.className = 'text';
                textDiv.textContent = msg.text;
                
                messageDiv.appendChild(senderDiv);
                messageDiv.appendChild(textDiv);
                messagesDiv.appendChild(messageDiv);
            });
            
            // Auto-scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        window.showTab = function(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Show/hide tabs
            if (tabName === 'friends') {
                document.getElementById('friendsTab').classList.remove('hidden');
                document.getElementById('chatTab').classList.add('hidden');
            } else {
                document.getElementById('friendsTab').classList.add('hidden');
                document.getElementById('chatTab').classList.remove('hidden');
            }
        };

        // Refresh messages periodically (simulates real-time)
        setInterval(() => {
            if (currentChatFriend && document.getElementById('chatContainer').classList.contains('hidden') === false) {
                const messagesDiv = document.getElementById('messages');
                const wasAtBottom = messagesDiv.scrollHeight - messagesDiv.scrollTop === messagesDiv.clientHeight;
                
                loadMessages();
                
                if (wasAtBottom) {
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            }
        }, 2000);
    </script>
</body>
</html>
